name: Test Single Cloudflare Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy via Wrangler CLI
        run: |
          export CLOUDFLARE_API_TOKEN="${{ secrets.CF_API_A }}"
          export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID_A }}"
          npx wrangler pages deploy . --project-name=history0-revisions --branch=main
