name: Test Single Cloudflare Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Account A
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_A }}
          accountId: ${{ secrets.CF_ACCOUNT_ID_A }}
          command: pages deploy . --project-name=history0-revisions
